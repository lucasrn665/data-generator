[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-data-generator"
version = "0.1.0"
description = "Gerador de dados bancários inteiramente sintéticos para exercícios de engenharia de dados."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Faker>=28,<40",
    "pyarrow>=17,<24",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

