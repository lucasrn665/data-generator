# Parâmetros reservados para as próximas etapas do gerador.
seed: 42
reference_date: "2026-01-01"

currency: BRL

output:
  directory: data/output
  format: csv

adls:
  enabled: false
  account_url: https://example.dfs.core.windows.net
  file_system: synthetic-data
  base_directory: banking
  overwrite: false
  max_concurrency: 4

event_hubs:
  enabled: false
  fully_qualified_namespace: example.servicebus.windows.net
  eventhub_name: synthetic-events
  events_per_second: 0
  max_batch_size: 100
  starting_position: beginning

customers:
  count: 10000

accounts:
  min_per_customer: 1
  max_per_customer: 3
  initial_balance:
    # Unidades monetárias completas em strings para conversão explícita a Decimal.
    min: "100.00"
    max: "50000.00"

merchants:
  count: 500

cards:
  per_account: 1
  daily_purchase_limit:
    min: "100.00"
    max: "5000.00"
  initially_blocked_rate: 0.05

transactions:
  count: 100000
  purchase_amount:
    min: "1.00"
    max: "500.00"
  history_days: 365
  # Proporção de todas as transações; independente do status.
  fraud_rate_overall: 0.005
  # Proporção de todas as tentativas que serão recusadas.
  declined_rate_overall: 0.03
  # Proporção apenas das transações inicialmente aprovadas.
  # Cada estorno deverá referenciar sua transação original.
  reversal_rate_of_approved: 0.01
  # Proporção de todos os eventos; independente de fraude e status.
  late_event_rate_overall: 0.02
  ingestion_delay:
    late_threshold_seconds: 300
    operational_min_seconds: 0
    operational_max_seconds: 30
    late_min_seconds: 301
    late_max_seconds: 86400

transfers:
  count: 10000
  min_amount: "10.00"
  max_amount: "1000.00"
  declined_rate_overall: 0.03
  history_days: 365

quality:
  scenario: valid
  rate: 0.01
  entity: customers
  field: synthetic_name

# Endereços não possuem configuração própria nesta etapa.
